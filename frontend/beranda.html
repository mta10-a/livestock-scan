<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beranda - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek">LivestockHealth</span>
        <span class="sub">Deteksi penyakit luar ternak</span>
      </span>
      <span class="spacer"></span>
      <button class="tombol mini polos" id="tombol-keluar" type="button">Keluar</button>
    </header>

    <main class="konten">
      <section class="hero-merek">
        <div class="salam" id="sapaan">Halo, …</div>
        <div class="ajak" id="ajak">Pantau kesehatan ternak Anda hari ini.</div>
        <div class="hero-angka">
          <div>
            <div class="angka" id="stat-satu">–</div>
            <div class="ket" id="stat-satu-ket">Scan gratis tersisa</div>
          </div>
          <div>
            <div class="angka" id="stat-dua">0</div>
            <div class="ket" id="stat-dua-ket">Ternak dipindai</div>
          </div>
        </div>
      </section>

      <a class="tombol mtk" href="scan.html" id="tombol-scan">
        <span data-ikon="kamera"></span> Mulai Scan
      </a>

      <div id="peringatan-wabah"></div>

      <div id="bagian-pemeriksaan">
        <div class="bagian">
          <span class="label-kecil" id="judul-pemeriksaan">Pemeriksaan terbaru</span>
          <a class="tautan-kecil" href="riwayat.html" id="tautan-pemeriksaan">Lihat semua</a>
        </div>
        <div id="pemeriksaan-terbaru"></div>
      </div>

      <div id="bagian-wabah">
        <div class="bagian" id="wabah">
          <span class="label-kecil" id="judul-wabah">Wabah di sekitar</span>
          <a class="tautan-kecil" href="peta.html" id="tautan-wabah">Lihat peta</a>
        </div>
        <div id="daftar-wabah">
          <div class="kosong">
            <span class="lingkaran" data-ikon="kosong"></span>
            <p>Memuat laporan wabah…</p>
          </div>
        </div>
      </div>

      <div class="bagian">
        <span class="label-kecil">Akses cepat</span>
      </div>
      <div class="grup" id="akses-cepat"></div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    pasangNavBawah('beranda');
    el('tombol-keluar').addEventListener('click', keluar);

    function aksesUntuk(me) {
      const profil = me.peran === 'dokter'
        ? { label: 'Profil Dokter', sub: 'Data akun dan nomor STR' }
        : me.peran === 'admin'
          ? { label: 'Profil Akun', sub: 'Data akun admin' }
          : { label: 'Profil Peternakan', sub: 'Data ternak, wilayah, akun dokter' };

      if (me.peran === 'dokter') {
        return [
          { label: 'Konsultasi Dokter', sub: 'Permintaan dari peternak', ikon: 'dokter', href: 'konsultasi.html' },
          { ...profil, ikon: 'dokumen', href: 'profil.html' },
        ];
      }

      if (me.peran === 'admin') {
        return [
          { label: 'Dashboard Admin', sub: 'Ringkasan, pengguna, verifikasi dokter', ikon: 'dokumen', href: 'admin.html' },
          { label: 'Peta Wabah', sub: 'Sebaran laporan peternak', ikon: 'peta', href: 'peta.html' },
          { ...profil, ikon: 'dokumen', href: 'profil.html' },
        ];
      }

      return [
        { label: 'Konsultasi Dokter', sub: 'Tanya dokter hewan', ikon: 'dokter', href: 'konsultasi.html' },
        { label: 'Riwayat Medis', sub: 'Semua hasil scan tersimpan', ikon: 'riwayat', href: 'riwayat.html' },
        { label: 'Peta Wabah', sub: 'Sebaran laporan peternak', ikon: 'peta', href: 'peta.html' },
        { label: 'E-Sertifikat', sub: 'Cetak dan verifikasi hasil', ikon: 'dokumen', href: 'sertifikat.html' },
        { ...profil, ikon: 'dokumen', href: 'profil.html' },
        { label: 'Lapor Wabah', sub: 'Laporkan ternak sakit di sekitar', ikon: 'lapor', href: 'lapor.html' },
        { label: 'Beli Token', sub: 'Tambah kuota scan', ikon: 'token', href: 'token.html' },
      ];
    }

    function renderAkses(me) {
      el('akses-cepat').innerHTML = aksesUntuk(me).map((a) => `
        <a class="baris" href="${a.href}">
          ${IKON[a.ikon]}
          <span class="baris-utama">
            <span class="baris-judul">${esc(a.label)}</span>
            <span class="baris-meta">${esc(a.sub)}</span>
          </span>
          <span class="chevron" data-ikon="chevron"></span>
        </a>`).join('');
      pasangIkon();
    }

    function bukaHasil(id) {
      sessionStorage.setItem('hasil_id', String(id));
      location.href = 'hasil.html';
    }

    function kartuTerbaru(r) {
      return `<button class="baris" type="button" onclick="bukaHasil(${Number(r.id)})">
        <span class="baris-utama">
          <span class="baris-judul">${esc(r.penyakit)}</span>
          <span class="baris-meta">${esc(spesiesInfo(r.spesies).nama)} · ${esc(formatTanggal(r.created_at))}</span>
        </span>
        <span class="pil ${kelasPil(r.confidence, r.penyakit)}">${persen(r.confidence)}</span>
        <span class="chevron" data-ikon="chevron"></span>
      </button>`;
    }

    function kartuWabah(l) {
      return `<div class="wabah">
        <span class="pil abu">${esc(spesiesInfo(l.spesies).nama)}</span>
        <span class="baris-utama">
          <span class="baris-judul">${esc(l.penyakit)}</span>
          <span class="kota">${esc(l.kecamatan)} · ${Number(l.jumlah_sakit)} ekor · ${esc(formatTanggal(l.created_at))}</span>
        </span>
      </div>`;
    }

    function kartuAntre(k) {
      const warna = k.status === 'menunggu' ? 'kuning' : 'hijau';
      return `<a class="baris" href="konsultasi.html?id=${Number(k.id)}">
        <span class="baris-utama">
          <span class="baris-judul">${esc(k.topik)}</span>
          <span class="baris-meta">${esc(k.nama_peternak)} · ${esc(formatTanggal(k.diperbarui))}</span>
        </span>
        <span class="pil ${warna}">${esc(k.status)}</span>
        <span class="chevron" data-ikon="chevron"></span>
      </a>`;
    }

    function kartuPemeriksaanAdmin(r) {
      return `<div class="baris">
        <span class="baris-utama">
          <span class="baris-judul">${esc(r.penyakit)}</span>
          <span class="baris-meta">${esc(r.nama)} · ${esc(spesiesInfo(r.spesies).nama)} · ${esc(formatTanggal(r.created_at))}</span>
        </span>
        <span class="pil ${kelasPil(r.keyakinan, r.penyakit)}">${persen(r.keyakinan)}</span>
      </div>`;
    }

    async function muatWabahTerbaru(tautan = 'lapor.html', label = 'Lapor wabah') {
      const wadah = el('daftar-wabah');
      try {
        const { laporan } = await api('/api/laporan/terbaru');
        wadah.innerHTML = laporan.length
          ? `<div class="grup">${laporan.slice(0, 3).map(kartuWabah).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="lapor"></span>
               <p>Belum ada laporan wabah terbaru.</p>
               <a class="tombol mini" href="${tautan}">${label}</a>
             </div>`;
      } catch (err) {
        wadah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }
    }

    async function tampilkanPeternak(me) {
      el('stat-satu').textContent = me.sisa_scan ?? 0;
      el('stat-dua').textContent = me.total_scan ?? 0;

      const wadahPeringatan = el('peringatan-wabah');
      try {
        const w = await api('/api/wabah/sekitar');
        if (w.jumlah > 0) {
          const contoh = w.laporan[0];
          const lokasi = w.dasar === 'alamat' ? `di wilayah ${esc(w.kata_kunci)}` : 'di Indonesia';
          wadahPeringatan.innerHTML = `<div class="catatan hati" style="margin-top:16px">
            ${IKON.peringatan}
            <span><b>${Number(w.jumlah)} laporan wabah</b> dalam 30 hari terakhir ${lokasi}.
            ${contoh ? `Terbaru: ${esc(contoh.penyakit)} di ${esc(contoh.kecamatan)}.` : ''}
            <a class="tautan-kecil" href="peta.html">Lihat peta</a></span>
          </div>`;
        }
      } catch {}

      const wadah = el('pemeriksaan-terbaru');
      try {
        const { riwayat } = await api('/api/riwayat');
        wadah.innerHTML = riwayat.length
          ? `<div class="grup">${riwayat.slice(0, 3).map(kartuTerbaru).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="kosong"></span>
               <p>Belum ada pemeriksaan. Mulai scan pertama Anda untuk melihat hasilnya di sini.</p>
               <a class="tombol mini" href="scan.html">Mulai scan</a>
             </div>`;
      } catch (err) {
        wadah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }

      await muatWabahTerbaru();
    }

    async function tampilkanDokter(me) {
      el('ajak').textContent = 'Jawab permintaan konsultasi dari peternak.';
      el('tombol-scan').remove();
      el('bagian-wabah').remove();
      el('judul-pemeriksaan').textContent = 'Konsultasi terbaru';
      el('tautan-pemeriksaan').href = 'konsultasi.html';

      const wadah = el('pemeriksaan-terbaru');
      try {
        const k = await api('/api/konsultasi');
        el('stat-satu').textContent = k.menunggu;
        el('stat-satu-ket').textContent = 'Menunggu jawaban';
        el('stat-dua').textContent = k.konsultasi.length;
        el('stat-dua-ket').textContent = 'Percakapan';

        const antre = k.konsultasi.filter(
          (x) => (x.status === 'menunggu' && !x.nama_dokter) || (x.status === 'aktif' && x.dokter_id === me.id)
        );
        wadah.innerHTML = antre.length
          ? `<div class="grup">${antre.slice(0, 3).map(kartuAntre).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="dokter"></span>
               <p>Belum ada konsultasi masuk.</p>
               <a class="tombol mini" href="konsultasi.html">Buka konsultasi</a>
             </div>`;
      } catch (err) {
        wadah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }
    }

    async function tampilkanAdmin() {
      el('ajak').textContent = 'Pantau pengguna, laporan wabah, dan pengajuan dokter.';
      el('tombol-scan').remove();
      el('judul-pemeriksaan').textContent = 'Pemeriksaan terbaru';
      el('judul-wabah').textContent = 'Laporan wabah terbaru';
      el('tautan-wabah').textContent = 'Buka peta';
      el('tautan-pemeriksaan').style.display = 'none';

      const wadah = el('pemeriksaan-terbaru');
      try {
        const r = await api('/api/admin/ringkasan');
        el('stat-satu').textContent = r.pengguna.total;
        el('stat-satu-ket').textContent = 'Pengguna terdaftar';
        el('stat-dua').textContent = r.laporan.total;
        el('stat-dua-ket').textContent = 'Laporan wabah';

        wadah.innerHTML = r.terbaru?.length
          ? `<div class="grup">${r.terbaru.map(kartuPemeriksaanAdmin).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="kosong"></span>
               <p>Belum ada hasil pemeriksaan.</p>
             </div>`;
      } catch (err) {
        wadah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }

      await muatWabahTerbaru('peta.html', 'Buka peta');
    }

    (async () => {
      const me = await butuhLogin();
      if (!me) return;

      const panggilan = me.nama.replace(/^(drh\.?|dr\.?|dokter)\s+/i, '').split(' ')[0];
      el('sapaan').textContent = `Halo, ${panggilan}`;
      renderAkses(me);

      if (me.peran === 'dokter') await tampilkanDokter(me);
      else if (me.peran === 'admin') await tampilkanAdmin();
      else await tampilkanPeternak(me);

      pasangIkon();
    })();
  </script>
</body>
</html>
