<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beranda - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek">LivestockHealth</span>
        <span class="sub">Deteksi penyakit luar ternak</span>
      </span>
      <span class="spacer"></span>
      <button class="tombol mini polos" id="tombol-keluar" type="button">Keluar</button>
    </header>

    <main class="konten">
      <section class="hero-merek">
        <div class="salam" id="sapaan">Halo, …</div>
        <div class="ajak">Pantau kesehatan ternak Anda hari ini.</div>
        <div class="hero-angka">
          <div>
            <div class="angka" id="stat-kuota">–</div>
            <div class="ket">Scan gratis tersisa</div>
          </div>
          <div>
            <div class="angka" id="stat-scan">0</div>
            <div class="ket">Ternak dipindai</div>
          </div>
        </div>
      </section>

      <a class="tombol mtk" href="scan.html">
        <span data-ikon="kamera"></span> Mulai Scan
      </a>

      <div id="peringatan-wabah"></div>

      <div class="bagian">
        <span class="label-kecil">Pemeriksaan terbaru</span>
        <a class="tautan-kecil" href="riwayat.html">Lihat semua</a>
      </div>
      <div id="pemeriksaan-terbaru"></div>

      <div class="bagian" id="wabah">
        <span class="label-kecil">Wabah di sekitar</span>
        <a class="tautan-kecil" href="peta.html">Lihat peta</a>
      </div>
      <div id="daftar-wabah">
        <div class="kosong">
          <span class="lingkaran" data-ikon="kosong"></span>
          <p>Memuat laporan wabah…</p>
        </div>
      </div>

      <div class="bagian">
        <span class="label-kecil">Akses cepat</span>
      </div>
      <div class="grup" id="akses-cepat"></div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    el('nav-bawah').innerHTML = navBawah('beranda');
    el('tombol-keluar').addEventListener('click', keluar);

    function aksesUntuk(me) {
      const dasar = [
        { label: 'Konsultasi Dokter', sub: me.peran === 'dokter' ? 'Permintaan dari peternak' : 'Tanya dokter hewan', ikon: 'dokter', href: 'konsultasi.html' },
        { label: 'Riwayat Medis', sub: 'Semua hasil scan tersimpan', ikon: 'riwayat', href: 'riwayat.html' },
        { label: 'Peta Wabah', sub: 'Sebaran laporan peternak', ikon: 'peta', href: 'peta.html' },
        { label: 'E-Sertifikat', sub: 'Cetak dan verifikasi hasil', ikon: 'dokumen', href: 'sertifikat.html' },
        { label: 'Profil Peternakan', sub: 'Data ternak, wilayah, akun dokter', ikon: 'dokumen', href: 'profil.html' },
        { label: 'Lapor Wabah', sub: 'Laporkan ternak sakit di sekitar', ikon: 'lapor', href: 'lapor.html' },
        { label: 'Beli Token', sub: 'Tambah kuota scan', ikon: 'token', href: 'token.html' },
      ];

      if (me.peran === 'admin') {
        dasar.unshift({ label: 'Dashboard Admin', sub: 'Ringkasan, pengguna, verifikasi dokter', ikon: 'dokumen', href: 'admin.html' });
      }

      return dasar;
    }

    function renderAkses(me) {
      el('akses-cepat').innerHTML = aksesUntuk(me).map((a) => `
        <a class="baris" href="${a.href}">
          ${IKON[a.ikon]}
          <span class="baris-utama">
            <span class="baris-judul">${esc(a.label)}</span>
            <span class="baris-meta">${esc(a.sub)}</span>
          </span>
          <span class="chevron" data-ikon="chevron"></span>
        </a>`).join('');
      pasangIkon();
    }

    function bukaHasil(id) {
      sessionStorage.setItem('hasil_id', String(id));
      location.href = 'hasil.html';
    }

    function kartuTerbaru(r) {
      return `<button class="baris" type="button" onclick="bukaHasil(${Number(r.id)})">
        <span class="baris-utama">
          <span class="baris-judul">${esc(r.penyakit)}</span>
          <span class="baris-meta">${esc(spesiesInfo(r.spesies).nama)} · ${esc(formatTanggal(r.created_at))}</span>
        </span>
        <span class="pil ${kelasPil(r.confidence, r.penyakit)}">${persen(r.confidence)}</span>
        <span class="chevron" data-ikon="chevron"></span>
      </button>`;
    }

    function kartuWabah(l) {
      return `<div class="wabah">
        <span class="pil abu">${esc(spesiesInfo(l.spesies).nama)}</span>
        <span class="baris-utama">
          <span class="baris-judul">${esc(l.penyakit)}</span>
          <span class="kota">${esc(l.kecamatan)} · ${Number(l.jumlah_sakit)} ekor · ${esc(formatTanggal(l.created_at))}</span>
        </span>
      </div>`;
    }

    (async () => {
      const me = await butuhLogin();
      if (!me) return;

      el('sapaan').textContent = `Halo, ${me.nama.split(' ')[0]}`;
      el('stat-kuota').textContent = me.sisa_scan ?? 0;
      el('stat-scan').textContent = me.total_scan ?? 0;
      renderAkses(me);

      const wadahPeringatan = el('peringatan-wabah');
      try {
        const w = await api('/api/wabah/sekitar');
        if (w.jumlah > 0) {
          const contoh = w.laporan[0];
          const lokasi = w.dasar === 'alamat' ? `di wilayah ${esc(w.kata_kunci)}` : 'di Indonesia';
          wadahPeringatan.innerHTML = `<div class="catatan hati" style="margin-top:16px">
            ${IKON.peringatan}
            <span><b>${Number(w.jumlah)} laporan wabah</b> dalam 30 hari terakhir ${lokasi}.
            ${contoh ? `Terbaru: ${esc(contoh.penyakit)} di ${esc(contoh.kecamatan)}.` : ''}
            <a class="tautan-kecil" href="peta.html">Lihat peta</a></span>
          </div>`;
        }
      } catch {}

      const wadah = el('pemeriksaan-terbaru');
      try {
        const { riwayat } = await api('/api/riwayat');
        wadah.innerHTML = riwayat.length
          ? `<div class="grup">${riwayat.slice(0, 3).map(kartuTerbaru).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="kosong"></span>
               <p>Belum ada pemeriksaan. Mulai scan pertama Anda untuk melihat hasilnya di sini.</p>
               <a class="tombol mini" href="scan.html">Mulai scan</a>
             </div>`;
      } catch (err) {
        wadah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }

      const wadahWabah = el('daftar-wabah');
      try {
        const { laporan } = await api('/api/laporan/terbaru');
        wadahWabah.innerHTML = laporan.length
          ? `<div class="grup">${laporan.slice(0, 3).map(kartuWabah).join('')}</div>`
          : `<div class="kosong">
               <span class="lingkaran" data-ikon="lapor"></span>
               <p>Belum ada laporan wabah. Laporkan ternak sakit di sekitar Anda agar peternak lain waspada.</p>
               <a class="tombol mini" href="lapor.html">Lapor wabah</a>
             </div>`;
      } catch (err) {
        wadahWabah.innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
      }

      pasangIkon();
    })();
  </script>
</body>
</html>
