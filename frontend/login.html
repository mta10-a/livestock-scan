<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="konten tanpa-nav center">
      <form class="kartu" id="form-masuk" style="width:100%;padding:26px 22px" novalidate>
        <div style="display:flex;flex-direction:column;align-items:center;gap:11px;margin-bottom:24px">
          <span class="logo" data-logo style="width:76px;height:76px"></span>
          <div class="teks-tengah">
            <div class="tebal" style="font-size:13.5px;color:var(--hijau);letter-spacing:-0.01em">LivestockHealth Scan</div>
            <div class="kecil teks-redup" style="margin-top:1px">Deteksi dini penyakit luar ternak</div>
          </div>
        </div>

        <h1 class="judul">Masuk</h1>
        <p class="subjudul" style="margin-bottom:20px">Gunakan email dan kata sandi akun Anda.</p>

        <div class="medan">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="nama@gmail.com" autocomplete="email" required />
        </div>

        <div class="medan">
          <label for="password">Kata Sandi</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <p class="pesan" id="pesan" role="alert"></p>

        <button class="tombol mtk" id="tombol-masuk" type="submit">Masuk</button>

        <div class="baris-antara" style="margin-top:15px">
          <a class="tautan-kecil" href="#" onclick="lupaSandi();return false">Lupa kata sandi</a>
          <a class="tautan-kecil" href="daftar.html">Buat akun baru</a>
        </div>

        <p class="kecil teks-redup teks-tengah" style="margin-top:22px;padding-top:16px;border-top:1px solid var(--garis)">
          Akun baru mendapat <b class="tebal" style="color:var(--hijau)">3x scan gratis</b>.
        </p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();

    function lupaSandi() {
      toast('Fitur lupa kata sandi belum tersedia pada prototype UTS.');
    }

    el('form-masuk').addEventListener('submit', async (e) => {
      e.preventDefault();
      setPesan('pesan', '');

      const email = el('email').value.trim();
      const password = el('password').value;

      if (!email || !password) return setPesan('pesan', 'Email dan kata sandi wajib diisi.');

      const tombol = el('tombol-masuk');
      tombol.disabled = true;
      tombol.textContent = 'Memeriksa…';

      try {
        await api('/api/login', { method: 'POST', body: { email, password } });
        location.replace('beranda.html');
      } catch (err) {
        setPesan('pesan', err.message);
      } finally {
        tombol.disabled = false;
        tombol.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
