<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pembayaran - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek">Pembayaran</span>
        <span class="sub" id="sub-gateway">Memeriksa gateway…</span>
      </span>
      <span class="spacer"></span>
      <a class="tombol mini polos" href="token.html">Token</a>
    </header>

    <main class="konten" id="konten">
      <div class="memuat">
        <div class="spinner"></div>
        <p class="sedang teks-redup">Memuat pesanan…</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();

    const parameter = new URLSearchParams(location.search);
    const kodePesanan = parameter.get('kode') || parameter.get('order_id') || '';
    const dariMidtrans = parameter.has('transaction_status');
    let konfGateway = { gateway: 'simulasi', mode: 'simulasi', client_key: '' };

    function pilStatus(status) {
      if (status === 'dibayar') return '<span class="pil hijau">dibayar</span>';
      if (status === 'batal') return '<span class="pil merah">batal</span>';
      return '<span class="pil kuning">menunggu</span>';
    }

    function rincian(p) {
      return `<div class="kartu">
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Kode pesanan</span>
          <span class="sedang" style="font-weight:600">${esc(p.kode)}</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Paket</span>
          <span class="sedang">${esc(p.nama_paket)} · ${Number(p.jumlah_scan)} scan</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Harga paket</span>
          <span class="sedang">${rupiah(p.harga)}</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Biaya layanan</span>
          <span class="sedang">${rupiah(p.biaya_layanan)}</span>
        </div>
        <div class="baris-antara" style="padding:8px 0;border-top:1px solid var(--garis)">
          <span class="sedang" style="font-weight:700">Total</span>
          <span class="sedang" style="font-weight:700">${rupiah(p.total)}</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Gateway</span>
          <span class="sedang">${p.gateway === 'midtrans' ? 'Midtrans' : 'Simulasi'}</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Metode</span>
          <span class="sedang">${esc(p.metode_label)}</span>
        </div>
        <div class="baris-antara" style="padding:6px 0">
          <span class="teks-redup kecil">Status</span>
          ${pilStatus(p.status)}
        </div>
      </div>`;
    }

    async function cekStatus(diam) {
      const tombol = el('cek');
      if (tombol) tombol.disabled = true;
      try {
        const hasil = await api('/api/pembayaran/' + encodeURIComponent(kodePesanan) + '/cek', { method: 'POST' });
        if (hasil.pesanan?.status === 'dibayar') {
          toast('Pembayaran diterima. Kuota bertambah.');
          tampilkan(hasil.pesanan);
          return;
        }
        if (hasil.pesanan?.status === 'batal') {
          tampilkan(hasil.pesanan);
          return;
        }
        if (!diam) setPesan('pesan', hasil.pesan || 'Pembayaran belum diterima.');
      } catch (err) {
        if (!diam) setPesan('pesan', err.message);
      } finally {
        if (el('cek')) el('cek').disabled = false;
      }
    }

    function muatSnap() {
      return new Promise((resolve, reject) => {
        if (window.snap) return resolve();
        if (!konfGateway.client_key) {
          return reject(new Error('Client Key Midtrans belum diisi.'));
        }

        const alamat = konfGateway.mode === 'production'
          ? 'https://app.midtrans.com/snap/snap.js'
          : 'https://app.sandbox.midtrans.com/snap/snap.js';
        const skrip = document.createElement('script');
        skrip.src = alamat;
        skrip.setAttribute('data-client-key', konfGateway.client_key);
        skrip.onload = () => (window.snap ? resolve() : reject(new Error('Midtrans Snap tidak tersedia.')));
        skrip.onerror = () => reject(new Error('Gagal memuat Midtrans Snap.'));
        document.head.appendChild(skrip);
      });
    }

    async function bukaSnap(p) {
      const tombol = el('bayar-midtrans');
      if (tombol) tombol.disabled = true;
      setPesan('pesan', '');
      let selesai = false;

      try {
        await muatSnap();
        window.snap.pay(p.gateway_token, {
          onSuccess: () => {
            selesai = true;
            toast('Pembayaran diterima.');
            cekStatus(true);
          },
          onPending: () => {
            toast('Pembayaran menunggu penyelesaian.');
            cekStatus(false);
          },
          onError: () => {
            setPesan('pesan', 'Pembayaran gagal diproses Midtrans.');
            if (tombol) tombol.disabled = false;
          },
          onClose: () => {
            if (selesai) return;
            if (tombol) tombol.disabled = false;
            setPesan('pesan', 'Jendela pembayaran ditutup. Buka lagi atau pakai tautan Midtrans.');
          },
        });
      } catch (err) {
        if (p.redirect_url) {
          location.href = p.redirect_url;
          return;
        }
        setPesan('pesan', err.message);
        if (tombol) tombol.disabled = false;
      }
    }

    function tampilkanMidtrans(p) {
      const bisaSnap = Boolean(konfGateway.client_key && p.gateway_token);
      const tombolSnap = bisaSnap
        ? '<button class="tombol" id="bayar-midtrans" type="button">Bayar dengan Midtrans</button>'
        : '';
      const tautan = p.redirect_url
        ? `<a class="${bisaSnap ? 'tombol polos' : 'tombol'}" href="${esc(p.redirect_url)}">Buka pembayaran Midtrans</a>`
        : '';

      el('konten').innerHTML = `
        <h2 class="judul">Selesaikan pembayaran</h2>
        <p class="subjudul" style="margin-bottom:16px">Kode QRIS atau nomor VA muncul di jendela pembayaran Midtrans.</p>
        ${rincian(p)}
        <div class="catatan netral" style="margin-top:16px">
          <span>Klik bayar untuk membuka halaman Midtrans, pilih QRIS/VA/e-wallet, lalu selesaikan. Setelah itu kuota dicek otomatis.</span>
        </div>
        <p class="pesan" id="pesan" role="alert"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          ${tombolSnap}
          ${tautan}
          <button class="tombol polos" id="cek" type="button">Cek status pembayaran</button>
        </div>
        <p class="kecil teks-redup" style="margin-top:10px">Pesanan berlaku 60 menit. ${konfGateway.mode === 'production' ? 'Pembayaran diproses oleh Midtrans.' : 'Di lingkungan Sandbox, pembayaran memakai alat uji Midtrans dan tidak memotong uang sungguhan.'}</p>`;

      if (bisaSnap) el('bayar-midtrans').addEventListener('click', () => bukaSnap(p));
      el('cek').addEventListener('click', () => cekStatus(false));
      pasangIkon();
      if (dariMidtrans) cekStatus(true);
    }

    function tampilkan(p) {
      if (p.status === 'dibayar') {
        el('konten').innerHTML = `
          <h2 class="judul">Pembayaran diterima</h2>
          <p class="subjudul" style="margin-bottom:16px">Kuota scan sudah ditambahkan otomatis ke akun Anda.</p>
          ${rincian(p)}
          <div class="catatan aman" style="margin-top:16px">
            <span>Pesanan ${esc(p.kode)} sudah dibayar pada ${esc(formatTanggal(p.dibayar_at))}. Tidak perlu menukar kode lagi.</span>
          </div>
          <div style="display:flex;gap:10px;margin-top:16px">
            <a class="tombol" href="token.html">Lihat riwayat</a>
            <a class="tombol polos" href="scan.html">Mulai scan</a>
          </div>`;
        pasangIkon();
        return;
      }

      if (p.status === 'batal') {
        el('konten').innerHTML = `
          <h2 class="judul">Pembayaran tidak selesai</h2>
          <p class="subjudul" style="margin-bottom:16px">Pesanan ini dibatalkan atau kedaluwarsa.</p>
          ${rincian(p)}
          <div class="catatan bahaya" style="margin-top:16px">
            <span>Kuota tidak bertambah. Silakan buat pesanan baru dari halaman token.</span>
          </div>
          <a class="tombol" href="token.html" style="margin-top:16px">Kembali ke token</a>`;
        pasangIkon();
        return;
      }

      if (p.gateway === 'midtrans') {
        tampilkanMidtrans(p);
        return;
      }

      el('konten').innerHTML = `
        <h2 class="judul">Selesaikan pembayaran</h2>
        <p class="subjudul" style="margin-bottom:16px">Periksa rincian biaya sebelum membayar.</p>
        ${rincian(p)}
        <div class="catatan hati" style="margin-top:16px">
          <span>Mode simulasi. Tombol di bawah meniru konfirmasi dari penyedia payment gateway; tidak ada uang yang benar-benar ditarik. Di produksi, konfirmasi dikirim oleh gateway, bukan dari halaman ini.</span>
        </div>
        <p class="pesan" id="pesan" role="alert"></p>
        <button class="tombol" id="bayar" type="button" style="margin-top:16px">Simulasikan pembayaran berhasil</button>`;

      el('bayar').addEventListener('click', async () => {
        el('bayar').disabled = true;
        try {
          const hasil = await api('/api/pembayaran/' + encodeURIComponent(p.kode) + '/bayar', { method: 'POST' });
          toast(hasil.pesan);
          await muat();
        } catch (err) {
          setPesan('pesan', err.message);
          el('bayar').disabled = false;
        }
      });
      pasangIkon();
    }

    async function muat() {
      try {
        const [hasil, konf] = await Promise.all([
          api('/api/pembayaran/' + encodeURIComponent(kodePesanan)),
          api('/api/pembayaran/config').catch(() => konfGateway),
        ]);
        konfGateway = konf && konf.gateway ? konf : konfGateway;
        const { pesanan } = hasil;
        el('sub-gateway').textContent = pesanan.gateway === 'midtrans'
          ? (konfGateway.mode === 'production' ? 'Midtrans' : 'Midtrans Sandbox')
          : 'Gateway simulasi';
        tampilkan(pesanan);
      } catch (err) {
        el('konten').innerHTML = `<div class="kosong">
          <span class="lingkaran" data-ikon="peringatan"></span>
          <p>${esc(err.message)}</p>
          <a class="tombol mini" href="token.html">Kembali ke token</a>
        </div>`;
        pasangIkon();
      }
    }

    (async () => {
      const me = await butuhLogin();
      if (!me) return;
      if (!kodePesanan) {
        location.replace('token.html');
        return;
      }
      await muat();
    })();
  </script>
</body>
</html>
