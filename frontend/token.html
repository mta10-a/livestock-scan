<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Token Scan - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek">Token Scan</span>
        <span class="sub" id="badge-kuota">Memuat…</span>
      </span>
      <span class="spacer"></span>
    </header>

    <main class="konten">
      <section class="hero-merek">
        <div class="salam">Kuota scan</div>
        <div class="ajak">Sisa kuota Anda saat ini.</div>
        <div class="hero-angka">
          <div>
            <div class="angka" id="sisa">–</div>
            <div class="ket">Scan tersisa</div>
          </div>
          <div>
            <div class="angka" id="total">0</div>
            <div class="ket">Total pemeriksaan</div>
          </div>
        </div>
      </section>

      <div class="bagian"><span class="label-kecil">Paket token</span></div>
      <div class="grup" id="paket"></div>

      <div class="bagian"><span class="label-kecil">Tukar kode token</span></div>
      <div class="kartu">
        <div class="medan">
          <label for="kode">Kode token</label>
          <input id="kode" type="text" placeholder="LHS-XXXX-XX" maxlength="40" autocomplete="off" />
        </div>
        <p class="pesan" id="pesan" role="alert"></p>
        <button class="tombol" id="tukar" type="button">Tukarkan kode</button>
        <p class="kecil teks-redup" style="margin-top:10px">Pembayaran otomatis lewat payment gateway belum aktif. Kode token didapat dari agen atau koperasi setempat setelah membayar paket di atas.</p>
      </div>

      <div class="bagian"><span class="label-kecil">Riwayat penukaran</span></div>
      <div id="transaksi"></div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    el('nav-bawah').innerHTML = navBawah('');

    function kartuPaket(p) {
      return `<div class="baris">
        <span class="baris-utama">
          <span class="baris-judul">${esc(p.nama)}</span>
          <span class="baris-meta">${Number(p.jumlah)} scan · ${rupiah(Math.round(p.harga / p.jumlah))} per scan</span>
        </span>
        <span class="pil hijau">${rupiah(p.harga)}</span>
      </div>`;
    }

    function kartuTransaksi(t) {
      return `<div class="baris">
        <span class="baris-utama">
          <span class="baris-judul">${esc(t.kode)}</span>
          <span class="baris-meta">${esc(formatTanggal(t.created_at))}</span>
        </span>
        <span class="pil hijau">+${Number(t.jumlah_scan)} scan</span>
      </div>`;
    }

    async function muat() {
      const me = await api('/api/profil');
      el('sisa').textContent = me.sisa_scan ?? 0;
      el('total').textContent = me.total_scan ?? 0;
      el('badge-kuota').textContent = `Sisa ${me.sisa_scan} scan`;

      const [paket, transaksi] = await Promise.all([
        api('/api/token/paket'),
        api('/api/token/transaksi'),
      ]);

      el('paket').innerHTML = paket.paket.map(kartuPaket).join('');
      el('transaksi').innerHTML = transaksi.transaksi.length
        ? `<div class="grup">${transaksi.transaksi.map(kartuTransaksi).join('')}</div>`
        : `<div class="kosong">
             <span class="lingkaran" data-ikon="token"></span>
             <p>Belum ada penukaran token.</p>
           </div>`;
      pasangIkon();
    }

    el('tukar').addEventListener('click', async () => {
      const kode = el('kode').value.trim();
      if (!kode) return setPesan('pesan', 'Masukkan kode token.');

      el('tukar').disabled = true;
      try {
        const hasil = await api('/api/token/tukar', { method: 'POST', body: { kode } });
        setPesan('pesan', hasil.pesan || 'Kode token berhasil ditukar.', 'sukses');
        el('kode').value = '';
        toast(`${hasil.tambah} scan ditambahkan.`);
        await muat();
      } catch (err) {
        setPesan('pesan', err.message);
      } finally {
        el('tukar').disabled = false;
      }
    });

    (async () => {
      const me = await butuhLogin();
      if (!me) return;
      try {
        await muat();
      } catch (err) {
        setPesan('pesan', err.message);
      }
    })();
  </script>
</body>
</html>
