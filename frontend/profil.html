<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil Peternakan - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek" id="judul-atas">Profil</span>
        <span class="sub" id="badge-akun">Memuat…</span>
      </span>
      <span class="spacer"></span>
    </header>

    <main class="konten">
      <h2 class="judul" id="judul-halaman">Data peternakan</h2>
      <p class="subjudul" id="sub-halaman" style="margin-bottom:16px">Dipakai untuk laporan wabah dan penyesuaian saran penanganan.</p>

      <div class="kartu">
        <div class="medan">
          <label for="nama" id="label-nama">Nama pemilik</label>
          <input id="nama" type="text" disabled />
        </div>
        <div class="medan">
          <label for="email">Email</label>
          <input id="email" type="email" disabled />
        </div>
        <div id="medan-peternakan">
          <div class="medan">
            <label for="peternakan">Nama peternakan</label>
            <input id="peternakan" type="text" placeholder="Contoh: Kandang Sumber Rejeki" maxlength="80" />
          </div>
          <div class="medan">
            <label for="alamat">Alamat atau kecamatan</label>
            <input id="alamat" type="text" placeholder="Contoh: Kec. Cibiru, Bandung" maxlength="160" />
          </div>
          <div class="medan">
            <label for="jenis">Jenis ternak utama</label>
            <select id="jenis">
              <option value="">Belum dipilih</option>
              <option value="sapi">Sapi</option>
              <option value="kambing">Kambing</option>
              <option value="ayam">Ayam</option>
              <option value="campuran">Campuran</option>
            </select>
          </div>
          <div class="medan">
            <label for="jumlah">Jumlah ternak</label>
            <input id="jumlah" type="number" min="0" max="1000000" placeholder="Contoh: 12" />
          </div>
          <p class="pesan" id="pesan" role="alert"></p>
          <button class="tombol" id="simpan" type="button">Simpan profil</button>
        </div>
      </div>

      <div class="bagian"><span class="label-kecil" id="label-bagian-dokter">Akun dokter hewan</span></div>
      <div id="kartu-dokter"></div>

      <div id="bagian-ringkasan">
        <div class="bagian"><span class="label-kecil">Ringkasan</span></div>
        <div class="grup">
          <div class="baris">
            <span class="baris-utama">
              <span class="baris-judul">Total pemeriksaan</span>
              <span class="baris-meta">Sejak akun dibuat</span>
            </span>
            <span class="pil hijau" id="total">0</span>
          </div>
          <div class="baris">
            <span class="baris-utama">
              <span class="baris-judul">Sisa kuota scan</span>
              <span class="baris-meta">Termasuk token yang sudah ditukar</span>
            </span>
            <span class="pil hijau" id="kuota">0</span>
          </div>
          <a class="baris" href="token.html">
            <span class="baris-utama">
              <span class="baris-judul">Tambah kuota</span>
              <span class="baris-meta">Tukar kode token</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </a>
        </div>
      </div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    pasangNavBawah('profil');

    function isi(me) {
      const dokter = me.peran === 'dokter';
      const admin = me.peran === 'admin';
      const judul = dokter ? 'Profil Dokter' : admin ? 'Profil Akun' : 'Profil Peternakan';

      document.title = judul + ' - LivestockHealth Scan';
      el('judul-atas').textContent = judul;
      el('judul-halaman').textContent = dokter ? 'Data dokter' : admin ? 'Data akun admin' : 'Data peternakan';
      el('sub-halaman').textContent = dokter
        ? 'Dipakai untuk konsultasi dan verifikasi akun dokter.'
        : admin
          ? 'Dipakai untuk mengelola pengguna dan verifikasi dokter.'
          : 'Dipakai untuk laporan wabah dan penyesuaian saran penanganan.';
      el('label-nama').textContent = me.peran === 'peternak' ? 'Nama pemilik' : 'Nama lengkap';
      el('label-bagian-dokter').textContent = dokter ? 'Status dokter' : admin ? 'Akses admin' : 'Akun dokter hewan';
      el('medan-peternakan').style.display = dokter || admin ? 'none' : '';
      el('bagian-ringkasan').style.display = dokter || admin ? 'none' : '';

      el('nama').value = me.nama || '';
      el('email').value = me.email || '';
      el('peternakan').value = me.profil?.nama_peternakan || '';
      el('alamat').value = me.profil?.alamat || '';
      el('jenis').value = me.profil?.jenis_ternak || '';
      el('jumlah').value = me.profil?.jumlah_ternak ?? '';
      el('total').textContent = me.total_scan ?? 0;
      el('kuota').textContent = me.sisa_scan ?? 0;
      el('badge-akun').textContent = dokter
        ? `STR ${me.dokter?.nomor_str || '-'}`
        : admin
          ? 'Akun admin'
          : me.profil?.nama_peternakan || 'Belum diisi';
      renderDokter(me);
    }

    function formPengajuan(me) {
      return `<form class="kartu" id="form-dokter">
        <p class="kecil teks-redup" style="margin-bottom:12px">
          Akun dokter dipakai untuk menjawab konsultasi peternak. Pengajuan diperiksa admin.
        </p>
        <div class="medan">
          <label for="nomor-str">Nomor STR</label>
          <input id="nomor-str" type="text" maxlength="40" placeholder="Contoh: 1234/STR/2024" value="${esc(me.dokter?.nomor_str || '')}" />
        </div>
        <div class="medan">
          <label for="wilayah">Wilayah praktik</label>
          <input id="wilayah" type="text" maxlength="80" placeholder="Contoh: Kota Bandung" value="${esc(me.dokter?.wilayah || '')}" />
        </div>
        <div class="medan">
          <label for="berkas">Berkas STR (JPG, PNG, atau PDF, maks. 2 MB)</label>
          <input id="berkas" type="file" accept="image/jpeg,image/png,application/pdf" />
        </div>
        <p class="pesan" id="pesan-dokter" role="alert"></p>
        <button class="tombol" type="submit">Kirim pengajuan</button>
      </form>`;
    }

    function renderDokter(me) {
      const wadah = el('kartu-dokter');
      if (!wadah) return;

      if (me.peran === 'admin') {
        wadah.innerHTML = `<div class="kartu"><p class="sedang">Akun admin tidak memerlukan pendaftaran dokter. Verifikasi pengajuan dokter dilakukan di <a class="tautan-kecil" href="admin.html">dashboard admin</a>.</p></div>`;
        return;
      }

      if (me.peran === 'dokter') {
        wadah.innerHTML = `<div class="grup">
          <div class="baris">
            <span class="baris-utama">
              <span class="baris-judul">Terverifikasi sebagai dokter</span>
              <span class="baris-meta">STR ${esc(me.dokter?.nomor_str || '-')} · ${esc(me.dokter?.wilayah || 'wilayah belum diisi')}</span>
            </span>
            <span class="pil hijau">dokter</span>
          </div>
          <a class="baris" href="konsultasi.html">
            <span class="baris-utama">
              <span class="baris-judul">Buka konsultasi masuk</span>
              <span class="baris-meta">Ambil permintaan dan balas peternak</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </a>
        </div>`;
        pasangIkon();
        return;
      }

      if (me.dokter && me.dokter.status === 'menunggu') {
        wadah.innerHTML = `<div class="grup">
          <div class="baris">
            <span class="baris-utama">
              <span class="baris-judul">Pengajuan sedang diperiksa</span>
              <span class="baris-meta">STR ${esc(me.dokter.nomor_str)} · ${esc(me.dokter.wilayah || '-')}</span>
            </span>
            <span class="pil kuning">menunggu</span>
          </div>
        </div>`;
        return;
      }

      const ditolak = me.dokter && me.dokter.status === 'ditolak'
        ? `<div class="catatan bahaya" style="margin-bottom:12px">
             <span>Pengajuan sebelumnya ditolak. ${esc(me.dokter.catatan || 'Periksa kembali berkas STR Anda.')}</span>
           </div>`
        : '';

      wadah.innerHTML = ditolak + formPengajuan(me);

      el('form-dokter').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const berkas = el('berkas').files[0];
        if (!berkas) {
          setPesan('pesan-dokter', 'Pilih berkas STR terlebih dahulu.');
          return;
        }

        const data = new FormData();
        data.append('nomor_str', el('nomor-str').value.trim());
        data.append('wilayah', el('wilayah').value.trim());
        data.append('berkas', berkas);

        const tombol = ev.target.querySelector('button[type="submit"]');
        tombol.disabled = true;
        try {
          await api('/api/dokter/daftar', { method: 'POST', formData: data });
          const terbaru = await api('/api/me');
          isi(terbaru);
          toast('Pengajuan dokter terkirim. Menunggu verifikasi admin.');
        } catch (err) {
          setPesan('pesan-dokter', err.message);
          tombol.disabled = false;
        }
      });
    }

    el('simpan').addEventListener('click', async () => {
      el('simpan').disabled = true;
      const jumlah = el('jumlah').value.trim();

      try {
        const me = await api('/api/profil', {
          method: 'PUT',
          body: {
            nama_peternakan: el('peternakan').value.trim(),
            alamat: el('alamat').value.trim(),
            jenis_ternak: el('jenis').value,
            jumlah_ternak: jumlah === '' ? null : Number(jumlah),
          },
        });
        isi(me);
        setPesan('pesan', 'Profil tersimpan.', 'sukses');
        toast('Profil peternakan diperbarui.');
      } catch (err) {
        setPesan('pesan', err.message);
      } finally {
        el('simpan').disabled = false;
      }
    });

    (async () => {
      const me = await butuhLogin();
      if (!me) return;
      isi(me);
      pasangIkon();
    })();
  </script>
</body>
</html>
