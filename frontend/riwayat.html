<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riwayat Medis - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="navbar-atas">
      <span class="logo" data-logo style="display:block;width:28px;height:32px"></span>
      <span class="nama-merek">Riwayat Medis</span>
      <span class="spacer"></span>
      <span class="badge" id="badge-jumlah">–</span>
    </header>

    <main class="konten">
      <h2 class="judul">Riwayat Pemeriksaan</h2>
      <p class="subjudul" style="margin-bottom:16px">Semua hasil scan tersimpan sebagai riwayat ternak Anda.</p>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px" id="filter"></div>
      <div id="daftar"></div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    el('nav-bawah').innerHTML = navBawah('riwayat');

    let semua = [];
    let filterAktif = 'semua';

    function renderFilter() {
      const opsi = [['semua', 'Semua'], ...Object.entries(SPESIES).map(([k, s]) => [k, `${s.emoji} ${s.nama}`])];
      el('filter').innerHTML = opsi.map(([k, label]) => `
        <button class="tombol kecil ${filterAktif === k ? '' : 'sekunder'}" data-filter="${k}" type="button">${label}</button>
      `).join('');
    }

    function kartu(r) {
      const s = spesiesInfo(r.spesies);
      return `<button class="riwayat-item" type="button" data-id="${r.id}">
        <span class="emoji">${s.emoji}</span>
        <span class="spacer">
          <span class="nama" style="display:block">${r.penyakit}</span>
          <span class="meta">${s.nama} · ${formatTanggal(r.created_at)}</span>
        </span>
        <span class="badge ${r.confidence >= AMBANG_PERINGATAN ? '' : 'abang'}">${persen(r.confidence)}</span>
      </button>`;
    }

    function renderDaftar() {
      const data = filterAktif === 'semua' ? semua : semua.filter((r) => r.spesies === filterAktif);
      if (!data.length) {
        el('daftar').innerHTML = `<div class="kosong">
          <div class="ikon">📋</div>
          <p class="sedang">Belum ada riwayat scan.</p>
          <a class="tombol mtk" href="scan.html" style="display:flex">Mulai Scan Pertama</a>
        </div>`;
        return;
      }
      el('daftar').innerHTML = data.map(kartu).join('');
    }

    el('filter').addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      filterAktif = b.dataset.filter;
      renderFilter();
      renderDaftar();
    });

    el('daftar').addEventListener('click', (e) => {
      const b = e.target.closest('[data-id]');
      if (!b) return;
      sessionStorage.setItem('hasil_id', b.dataset.id);
      location.href = 'hasil.html';
    });

    (async () => {
      const me = await butuhLogin();
      if (!me) return;

      try {
        const data = await api('/api/riwayat');
        semua = data.riwayat || [];
        el('badge-jumlah').textContent = `${semua.length} data`;
        renderFilter();
        renderDaftar();
      } catch (err) {
        el('daftar').innerHTML = `<p class="pesan error">${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
