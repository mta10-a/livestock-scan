<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hasil Analisis - LivestockHealth Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="bilah-atas">
      <span class="logo" data-logo></span>
      <span class="kunci-bilah">
        <span class="nama-merek">Hasil Analisis</span>
        <span class="sub" id="badge-tanggal">Memuat…</span>
      </span>
      <span class="spacer"></span>
    </header>

    <main class="konten" id="konten">
      <div class="memuat">
        <div class="spinner"></div>
        <p class="sedang teks-redup">Memuat hasil pemeriksaan…</p>
      </div>
    </main>

    <div id="nav-bawah"></div>
  </div>

  <script src="app.js"></script>
  <script>
    pasangLogo();
    pasangNavBawah('scan');

    const KELILING = 326.73;

    function render(hasil) {
      const s = spesiesInfo(hasil.spesies);
      const c = hasil.confidence ?? 0;
      const tingkat = tingkatKeyakinan(c);
      const geser = (KELILING * (1 - c)).toFixed(1);

      const kunciCatatan = hasilnyaSehat(hasil.penyakit) && tingkat !== 'rendah' ? 'sehat' : tingkat;

      const rek = hasil.rekomendasi || {};
      const fitur = (hasil.fitur_visual || []).map((f) => `<li>${esc(f)}</li>`).join('');
      const medis = (rek.medis || []).map((m) => `<li>${esc(m)}</li>`).join('');
      const herbal = (rek.herbal || []).map((m) => `<li>${esc(m)}</li>`).join('');
      const sumber = (rek.sumber || []).map((s) => `<li>${esc(s)}</li>`).join('');
      const kf = hasil.kualitas_foto;
      const pendapat = hasil.pendapat_kedua;
      const saranPendapat = pendapat && Array.isArray(pendapat.saran)
        ? pendapat.saran.map((s) => `<li>${esc(s)}</li>`).join('')
        : '';

      el('konten').innerHTML = `
        <div class="cetak-saja cetak-kepala">
          <div class="cetak-judul">LivestockHealth Scan</div>
          <div class="cetak-ket">Lembar hasil pemeriksaan ${esc(s.nama.toLowerCase())} · ${esc(formatTanggal(hasil.created_at))}</div>
        </div>

        <section class="hero-hasil">
          <div class="donat-bungkus">
            <svg class="donat ${kelasBar(c, hasil.penyakit)}" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="jejak" cx="60" cy="60" r="52"></circle>
              <circle class="nilai" cx="60" cy="60" r="52"
                      style="stroke-dasharray:${KELILING};stroke-dashoffset:${geser}"></circle>
            </svg>
            <div class="donat-inti">
              <b>${persen(c)}</b>
              <span>KEYAKINAN</span>
            </div>
          </div>

          <div class="penyakit">${esc(hasil.penyakit)}</div>
          <div class="meta-hasil">${esc(s.nama)} · keyakinan ${tingkat} · ${esc(hasil.model || 'model tidak tercatat')}</div>

          ${kf ? `<p class="kecil teks-redup" style="margin-top:12px">
            Foto ${kf.lebar_asli}×${kf.tinggi_asli} px dinormalisasi ke ${kf.ukuran_model.join('×')} ·
            kecerahan ${kf.kecerahan} · kontras ${kf.kontras}
          </p>` : ''}
        </section>

        ${{
          rendah: `<div class="catatan netral">
               ${IKON.peringatan}
               <span><b>Keyakinan rendah.</b> Nilai di bawah ${persen(AMBANG_PERINGATAN)}, sehingga hasil belum dapat
               dipercaya. Ambil ulang foto dengan cahaya yang cukup, lalu konsultasikan ke dokter hewan.</span>
             </div>`,
          sedang: `<div class="catatan hati">
               ${IKON.peringatan}
               <span>Hasil ini <b>indikasi awal</b>, bukan diagnosis pasti. Tetap konsultasikan ke dokter hewan.</span>
             </div>`,
          tinggi: `<div class="catatan bahaya">
               ${IKON.peringatan}
               <span><b>Perlu penanganan segera.</b> Ternak terindikasi ${esc(hasil.penyakit)} dengan keyakinan
               ${persen(c)}. Pisahkan ternak yang sakit dan hubungi dokter hewan.</span>
             </div>`,
          sehat: `<div class="catatan aman">
               ${IKON.cek}
               <span><b>Ternak tampak sehat.</b> Model tidak menemukan ciri penyakit luar dengan keyakinan
               ${persen(c)}. Tetap lakukan pemeriksaan rutin, vaksinasi, dan sanitasi kandang secara berkala.</span>
             </div>`,
        }[kunciCatatan]}

        ${hasil.gejala ? `
          <div class="bagian"><span class="label-kecil">Catatan gejala</span></div>
          <div class="kartu"><p class="sedang">${esc(hasil.gejala)}</p></div>` : ''}

        <div class="bagian"><span class="label-kecil">Ciri khas kelas terpilih</span></div>
        <div class="kartu"><ul class="daftar">${fitur || '<li>Tidak ada catatan.</li>'}</ul></div>

        ${pendapat ? `
          <div class="bagian"><span class="label-kecil">Pendapat kedua</span></div>
          <div class="kartu">
            <div class="baris-antara" style="margin-bottom:10px">
              <span class="tebal sedang">Penilaian AI umum</span>
              <span class="pil ${pendapat.sejalan ? 'hijau' : 'kuning'}">${pendapat.sejalan ? 'sejalan' : 'beda pendapat'}</span>
            </div>
            ${pendapat.kesan ? `<p class="sedang"><b>Kesan foto:</b> ${esc(pendapat.kesan)}</p>` : ''}
            <p class="sedang" style="margin-top:6px">${esc(pendapat.penjelasan)}</p>
            ${saranPendapat ? `<ul class="daftar" style="margin-top:10px">${saranPendapat}</ul>` : ''}
            <p class="kecil teks-redup" style="margin-top:10px">Dijawab ${esc(pendapat.sumber || 'AI umum')} dari foto yang sama, bukan dokter hewan. Bila pendapatnya berbeda, utamakan pemeriksaan dokter.</p>
          </div>
        ` : ''}

        <div class="bagian"><span class="label-kecil">Penanganan medis</span></div>
        <div class="kartu">
          <div class="baris-antara" style="margin-bottom:8px">
            <span class="tebal sedang">Langkah pengobatan</span>
            <span data-ikon="obat" style="width:17px;height:17px;color:var(--hijau)"></span>
          </div>
          <ol class="daftar nomor">${medis || '<li>Belum ada rekomendasi.</li>'}</ol>
        </div>

        <div class="bagian"><span class="label-kecil">Jamu / herbal pendukung</span></div>
        <div class="kartu">
          <div class="baris-antara" style="margin-bottom:8px">
            <span class="tebal sedang">Ramuan tradisional</span>
            <span data-ikon="herbal" style="width:17px;height:17px;color:#7d9b3e"></span>
          </div>
          <ul class="daftar herbal">${herbal || '<li>Belum ada rekomendasi.</li>'}</ul>
          <p class="kecil teks-redup" style="margin-top:8px">Rekomendasi disusun dari rujukan umum dan belum divalidasi dokter hewan. Herbal bersifat pendukung, bukan pengganti pengobatan medis.</p>
        </div>

        ${sumber ? `
          <div class="bagian"><span class="label-kecil">Rujukan veteriner</span></div>
          <div class="kartu"><ul class="daftar">${sumber}</ul></div>
        ` : ''}

        <div class="bagian bagian-kirim"><span class="label-kecil">Kirim ke peternak</span></div>
        <div class="grup">
          <button class="baris" type="button" id="tombol-wa">
            ${IKON.chat}
            <span class="baris-utama">
              <span class="baris-judul">Kirim lewat WhatsApp</span>
              <span class="baris-meta">Pilih kontak, ringkasan hasil langsung terisi</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </button>
          <button class="baris" type="button" id="tombol-bagikan">
            ${IKON.bagikan}
            <span class="baris-utama">
              <span class="baris-judul">Bagikan hasil</span>
              <span class="baris-meta">Kirim ringkasan lewat aplikasi lain</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </button>
          <button class="baris" type="button" id="tombol-salin">
            ${IKON.salin}
            <span class="baris-utama">
              <span class="baris-judul">Salin ringkasan</span>
              <span class="baris-meta">Tempel ke catatan atau pesan</span>
            </span>
          </button>
          <button class="baris" type="button" id="tombol-cetak">
            ${IKON.cetak}
            <span class="baris-utama">
              <span class="baris-judul">Cetak lembar hasil</span>
              <span class="baris-meta">Simpan sebagai PDF atau cetak untuk dokter hewan</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </button>
          ${hasil.kode_sertifikat ? `<a class="baris" href="sertifikat.html?kode=${encodeURIComponent(hasil.kode_sertifikat)}">
            ${IKON.dokumen}
            <span class="baris-utama">
              <span class="baris-judul">Buka sertifikat hasil</span>
              <span class="baris-meta">Kode ${esc(hasil.kode_sertifikat)} · bisa dicetak dan diverifikasi</span>
            </span>
            <span class="chevron" data-ikon="chevron"></span>
          </a>` : ''}
        </div>

        <p class="cetak-saja cetak-kaki">Hasil ini dihasilkan model AI LivestockHealth Scan dan bersifat indikasi awal, bukan diagnosis resmi dokter hewan.</p>

        <div style="display:flex;gap:10px;margin-top:22px">
          <a class="tombol garis" href="riwayat.html">Riwayat</a>
          <a class="tombol" href="scan.html">Scan lagi</a>
        </div>
      `;

      el('badge-tanggal').textContent = formatTanggal(hasil.created_at);
      pasangIkon();
      pasangLogo();
      el('tombol-wa').onclick = () => kirimWhatsApp(hasil);
      el('tombol-bagikan').onclick = () => bagikanHasil(hasil);
      el('tombol-salin').onclick = () => salinRingkasan(hasil);
      el('tombol-cetak').onclick = () => window.print();
    }

    (async () => {
      const me = await butuhLogin();
      if (!me) return;

      const id = sessionStorage.getItem('hasil_id');
      if (id) {
        try {
          const { hasil } = await api('/api/riwayat/' + id);
          render(hasil);
        } catch (err) {
          el('konten').innerHTML = `<p class="pesan error">${esc(err.message)}</p>`;
        }
        return;
      }

      const hasil = ambilHasil();
      if (!hasil) { location.replace('scan.html'); return; }
      render(hasil);
    })();
  </script>
</body>
</html>
